name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: test_jwt_secret_key_freelanceflow_testing
      ALLOW_DEMO_AUTH: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript check
        run: npm run lint

      - name: Run API test suite
        run: npm test

      - name: Build project
        run: npm run build
